apiVersion: v1
kind: ConfigMap
metadata:
  name: go-server-config
data:
  redis_addr: redis-service:6379
  app_env: "production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server
  labels:
    app: go-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-server
  template:
    metadata:
      labels:
        app: go-server
    spec:
      containers:
      - name: go-server
        image: why5899/go-server:v1.4.6
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: go-server-config
              key: redis_addr
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: go-server-config
              key: app_env
        - name: K8S_ENGINE_STATEFULSET
          value: "pokemon-server"
        - name: K8S_ENGINE_HEADLESS_SERVICE
          value: "pokemon-server-headless"
        - name: K8S_ENGINE_NAMESPACE
          value: "default"
        - name: K8S_ENGINE_PORT
          value: "50051"
        livenessProbe:
          httpGet:
            path: /debug/engine
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /debug/engine
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: go-server
spec:
  type: NodePort
  selector:
    app: go-server
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
